name: Build playbook

# Push / pull request: validate src/ and build the .apbx (download it from the run's Artifacts).
# Release: Actions > Build playbook > Run workflow, branch main, tick "Publish release"
# (or push a tag v<version>). The tag is v<Version> from src/playbook.conf; the release gets the .apbx and SHA256SUMS.txt.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish release v<Version> from src/playbook.conf'
        type: boolean
        default: false
      screenshots:
        description: 'Push Akati OS Center screenshots to the ci-screenshots branch'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version
        id: version
        run: |
          version=$(tr -d '\r' < src/playbook.conf | sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check playbook.conf
        run: |
          python3 tools/check-playbook.py src/playbook.conf
          python3 tools/check-playbook.py src-win10/playbook.conf

      - name: Validate YAML
        run: |
          command -v yamllint >/dev/null || pipx install yamllint
          yamllint -d "{extends: relaxed, rules: {empty-lines: disable, line-length: disable, new-line-at-end-of-file: disable, trailing-spaces: disable, new-lines: disable}}" src src-win10

      - name: Check version is consistent
        if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/main')
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in playbook.conf"
            exit 1
          fi
          for d in src src-win10; do
            v=$(tr -d '\r' < $d/playbook.conf | sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' | head -n1)
            [ "$v" = "$version" ] || { echo "::error::$d/playbook.conf version $v is not $version"; exit 1; }
            grep -q "\$version = 'v$version'" $d/Configuration/tweaks/misc/config-oem-information.yml \
              || { echo "::error::$d config-oem-information.yml \$version is not v$version"; exit 1; }
            grep -q "^## v$version" $d/CHANGELOG.md \
              || { echo "::error::$d/CHANGELOG.md has no '## v$version' section"; exit 1; }
            grep -q "v$version" $d/CREDITS.txt \
              || { echo "::error::$d/CREDITS.txt does not mention v$version"; exit 1; }
          done

      - name: Build
        run: ./build.sh

      - name: Upload build
        uses: actions/upload-artifact@v5
        with:
          name: AkatiOS-${{ github.sha }}
          path: dist/

  build-windows:
    # Checks that build.ps1 works the same on Windows (the release uses the Linux build)
    runs-on: windows-latest
    permissions:
      contents: write   # only used by the optional screenshots step
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem src, src-win10, tools, build.ps1 -Recurse -Include *.ps1, *.psm1
          $bad = 0
          foreach ($f in $files) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
          }
          Write-Host "Checked $($files.Count) files, $bad errors"
          if ($bad) { exit 1 }

      - name: Check the Riot installer signature
        # GAMEAPPS.ps1 runs the Riot installer only when it is signed by Riot Games. Warning only, so a
        # download problem on Riot's side does not fail the build.
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: powershell
        run: |
          $file = "$env:RUNNER_TEMP\riot.exe"
          curl.exe -LSs "https://valorant.secure.dyn.riotcdn.net/channels/public/x/installer/current/live.live.ap.exe" -o $file
          $sig = Get-AuthenticodeSignature -FilePath $file
          Write-Host "Size: $((Get-Item $file).Length) bytes; signature: $($sig.Status); signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notlike '*Riot Games*') { Write-Host "::warning::The Riot installer is not signed by Riot Games"; exit 1 }

      - name: Check the desktop menu
        shell: powershell
        run: |
          $script = "src\Executables\AtlasModules\AkatiCenter\AkatiMenu.ps1"
          New-Item -Path 'HKCU:\Software\AkatiOS\Center' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Software\AkatiOS\Center' -Name MenuApps -Value ([string[]]@('Steam|"C:\Steam\steam.exe"|C:\Steam\steam.exe')) -Type MultiString
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Install
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $root = 'HKLM:\SOFTWARE\Classes\DesktopBackground\Shell\AkatiOS'
          Get-ChildItem -Path $root -Recurse | ForEach-Object {
            $p = Get-ItemProperty -LiteralPath $_.PSPath
            Write-Host ("{0} | {1} | {2}" -f $_.Name.Replace('HKEY_LOCAL_MACHINE\SOFTWARE\Classes\DesktopBackground\Shell\', ''), $p.MUIVerb, $p.'(default)')
          }
          $task = Get-ScheduledTask -TaskPath '\AkatiOS\' -TaskName 'Akati OS menu' -ErrorAction Stop
          Write-Host "Task: $($task.Principal.UserId) $($task.Principal.RunLevel) $($task.Actions.Arguments)"
          if (@(Get-ChildItem "$root\shell").Count -ne 9) { Write-Host "::error::The menu does not have 9 items"; exit 1 }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -Remove
          if (Test-Path $root) { Write-Host "::error::-Remove left the menu"; exit 1 }

      - name: Render Akati OS Center screenshots
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File src\Executables\AtlasModules\AkatiCenter\AkatiCenter.ps1 -Screenshot "$env:GITHUB_WORKSPACE\screenshots" -Root src\Executables
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        with:
          name: akati-center-screenshots
          path: screenshots/

      - name: Push screenshots to the ci-screenshots branch
        if: inputs.screenshots
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          git init -q -b ci-screenshots
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Akati OS Center screenshots for $GITHUB_SHA"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Build with build.ps1
        run: .\build.ps1

      - name: Verify checksum
        shell: bash
        run: cd dist && sha256sum -c SHA256SUMS.txt

  release:
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.build.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download build
        uses: actions/download-artifact@v5
        with:
          name: AkatiOS-${{ github.sha }}
          path: dist/

      - name: Verify checksum
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          {
            tr -d '\r' < src/CHANGELOG.md | awk -v h="## v$version" '$0==h {f=1; next} /^## / {f=0} f'
            echo
            echo "## Download"
            echo
            echo "- Windows 11 (24H2, 25H2, 26H2): \`AkatiOS_v$version.apbx\`"
            echo "- Windows 10 22H2: \`AkatiOS-Win10_v$version.apbx\` (Windows 10 is out of support, use the Windows 11 version if you can)"
            echo
            echo "Check the file against \`SHA256SUMS.txt\`:"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Back up your files and test in a virtual machine first. See [docs/TESTING.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/TESTING.md)."
            echo
            echo "Based on [AtlasOS](https://github.com/Atlas-OS/Atlas) (GPL-3.0). Not an official AtlasOS project. Changes: [docs/CHANGES-FROM-ATLAS.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/CHANGES-FROM-ATLAS.md)."
          } > notes.md
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version first."
            exit 1
          fi
          gh release create "$TAG" dist/*.apbx dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Akati OS $TAG" \
            --notes-file notes.md
