---
title: Akati OS Extras
description: Microsoft Store removal, notifications and Game Bar selected during setup, the Akati OS Windows Terminal color scheme and Akati OS Center shortcuts (Akati OS)
actions:
  - !writeStatus: {status: 'Applying Akati OS extras'}
    # Remove the Microsoft Store (option, ticked by default). Get it back with Akati OS Center or "wsreset -i"
  - !writeStatus: {status: 'Removing Microsoft Store', option: 'remove-store'}
  - !taskKill: {name: 'WinStore.App', ignoreErrors: true, option: 'remove-store'}
  - !appx: {name: 'Microsoft.WindowsStore*', type: family, option: 'remove-store'}

    # Notifications off (option, ticked by default): the "Get notifications from apps and other
    # senders" switch in Settings > System > Notifications. Turn it on again there.
  - !registryValue: {path: 'HKCU\Software\Microsoft\Windows\CurrentVersion\PushNotifications', value: 'ToastEnabled', data: '0', type: REG_DWORD, option: 'disable-notifications'}

    # Xbox Game Bar off (option, ticked by default): the same user settings as the AtlasOS task
    # tweaks\performance\disable-game-bar.yml, without its policies, so it can be turned on again in
    # Settings > Gaming > Game Bar. Game Mode and fullscreen optimizations are not changed.
  - !registryValue: {path: 'HKCU\System\GameConfigStore', value: 'GameDVR_Enabled', data: '0', type: REG_DWORD, option: 'disable-game-bar'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\GameDVR', value: 'AppCaptureEnabled', data: '0', type: REG_DWORD, option: 'disable-game-bar'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\GameBar', value: 'UseNexusForGameBarEnabled', data: '0', type: REG_DWORD, option: 'disable-game-bar'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\GameBar', value: 'ShowStartupPanel', data: '0', type: REG_DWORD, option: 'disable-game-bar'}
  - !registryValue: {path: 'HKCU\SOFTWARE\Microsoft\GameBar', value: 'GamePanelStartupTipIndex', data: '3', type: REG_DWORD, option: 'disable-game-bar'}

    # Sticky Keys, Filter Keys and Toggle Keys: their keyboard shortcuts off (option, ticked by default), so
    # pressing Shift 5 times or holding it in a game no longer opens a window. Windows defaults with bit 4
    # (the shortcut) cleared: 510 > 506, 126 > 122, 62 > 58. Can be turned on again in Akati OS Center > Tweaks.
  - !registryValue: {path: 'HKCU\Control Panel\Accessibility\StickyKeys', value: 'Flags', data: '506', type: REG_SZ, option: 'disable-accessibility-shortcuts'}
  - !registryValue: {path: 'HKCU\Control Panel\Accessibility\Keyboard Response', value: 'Flags', data: '122', type: REG_SZ, option: 'disable-accessibility-shortcuts'}
  - !registryValue: {path: 'HKCU\Control Panel\Accessibility\ToggleKeys', value: 'Flags', data: '58', type: REG_SZ, option: 'disable-accessibility-shortcuts'}

    # Windows Terminal color scheme and profile for all users (a Terminal "fragment")
  - !powerShell:
    command: |
      $dir = Join-Path $env:ProgramData 'Microsoft\Windows Terminal\Fragments\AkatiOS'
      New-Item -ItemType Directory -Path $dir -Force | Out-Null
      Copy-Item -Path '.\AtlasModules\Other\AkatiOS\terminal-fragment.json' -Destination (Join-Path $dir 'akatios.json') -Force
    exeDir: true
    wait: true

    # Akati OS Center shortcuts on the desktop and in the Start menu (all users)
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      $shell = New-Object -ComObject WScript.Shell
      foreach ($folder in @([Environment]::GetFolderPath('CommonDesktopDirectory'), (Join-Path ([Environment]::GetFolderPath('CommonStartMenu')) 'Programs'))) {
          $lnk = $shell.CreateShortcut((Join-Path $folder 'Akati OS Center.lnk'))
          $lnk.TargetPath = Join-Path $windir 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $lnk.Arguments = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "' + (Join-Path $windir 'AtlasModules\AkatiCenter\AkatiCenter.ps1') + '"'
          $lnk.IconLocation = (Join-Path $windir 'AtlasModules\Other\akatios-folder.ico') + ',0'
          $lnk.Description = 'Akati OS Center'
          $lnk.WindowStyle = 7
          $lnk.Save()
      }
    wait: true
