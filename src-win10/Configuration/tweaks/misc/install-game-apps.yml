---
title: Install Gaming Apps
description: Installs gaming apps selected during setup (Akati OS)
actions:
  - !writeStatus: {status: 'Installing Steam', option: 'install-steam'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Steam'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-steam'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing Epic Games Launcher', option: 'install-epic'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Epic'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-epic'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing EA app', option: 'install-ea'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App EA'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-ea'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing Ubisoft Connect', option: 'install-ubisoft'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Ubisoft'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-ubisoft'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing Battle.net', option: 'install-battlenet'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App BattleNet'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-battlenet'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing OBS Studio', option: 'install-obs'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App OBS'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-obs'
    runas: currentUserElevated
    # "Recommended" on the gaming apps page: Steam (the app pages are not shown)
  - !writeStatus: {status: 'Installing Steam', option: 'akati-recommended'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Steam'
    exeDir: true
    wait: true
    weight: 40
    option: 'akati-recommended'
    runas: currentUserElevated
