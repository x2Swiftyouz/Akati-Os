---
title: Install Gaming Apps
description: Installs gaming apps selected during setup (Akati OS)
actions:
  - !writeStatus: {status: 'Installing Steam', option: 'install-steam'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Steam'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-steam'
    runas: currentUserElevated
    # Discord is not installed during setup: setup restarts the PC while Discord installs and updates itself,
    # and programs started right at sign-in (RunOnce) were stopped half way. A scheduled task installs it
    # as the user 2 minutes after sign-in (GAMEAPPS.ps1 -AtSignIn) and removes itself once Discord is installed.
  - !writeStatus: {status: 'Discord will be installed after restart', option: 'install-discord'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Discord -AtSignIn'
    exeDir: true
    wait: true
    option: 'install-discord'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing Epic Games Launcher', option: 'install-epic'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Epic'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-epic'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing EA app', option: 'install-ea'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App EA'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-ea'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing Ubisoft Connect', option: 'install-ubisoft'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Ubisoft'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-ubisoft'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing Battle.net', option: 'install-battlenet'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App BattleNet'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-battlenet'
    runas: currentUserElevated
  - !writeStatus: {status: 'Installing OBS Studio', option: 'install-obs'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App OBS'
    exeDir: true
    wait: true
    weight: 40
    option: 'install-obs'
    runas: currentUserElevated
    # "Recommended" on the gaming apps page: Steam and Discord (the app pages are not shown)
  - !writeStatus: {status: 'Installing Steam', option: 'akati-recommended'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Steam'
    exeDir: true
    wait: true
    weight: 40
    option: 'akati-recommended'
    runas: currentUserElevated
  - !writeStatus: {status: 'Discord will be installed after restart', option: 'akati-recommended'}
  - !powerShell:
    command: '.\AtlasModules\Scripts\GAMEAPPS.ps1 -App Discord -AtSignIn'
    exeDir: true
    wait: true
    option: 'akati-recommended'
    runas: currentUserElevated
