<?xml version="1.0" encoding="utf-8"?>
<Playbook>
	<Name>AkatiOS10</Name>
	<Username>AkatiOS</Username>
	<Title>Akati OS v1.7.2 for Windows 10</Title>
	<ShortDescription>Personal Windows 10 gaming playbook</ShortDescription>
	<Description><![CDATA[Akati OS for Windows 10 22H2: personal playbook focused on gaming performance, privacy, debloat and a custom theme.

Windows 10 is out of support: Microsoft no longer ships security updates for most users. Use the Windows 11 version of Akati OS if you can.
Based on AtlasOS v0.4.1 (GPL-3.0), not an official AtlasOS project.
Back up your files before you start. This playbook cannot be fully undone: to go back, reinstall Windows.
Test in a virtual machine first.]]></Description>
	<Details>Gaming, privacy and debloat tweaks for Windows 10 22H2.</Details>
	<ProgressText><![CDATA[Akati OS is installing software, copying configuration folders and tweaking Windows. Do not turn off your computer.]]></ProgressText>
	<Version>1.7.2</Version>
	<SupportedBuilds>
		<!-- Windows 10 22H2 -->
		<string>19045</string>
	</SupportedBuilds>
	<Requirements>
		<Requirement>DefenderToggled</Requirement>
		<Requirement>NoAntivirus</Requirement>
		<Requirement>Internet</Requirement>
		<Requirement>NoPendingUpdates</Requirement>
		<Requirement>PluggedIn</Requirement>
		<Requirement>FreshInstall</Requirement>
	</Requirements>
	<UniqueId>68828e3e-e506-48ea-a88a-460e8f5bca15</UniqueId>
	<InstallGuide>https://github.com/x2Swiftyouz/Akati-Os#windows-10</InstallGuide>
	<Overhaul>true</Overhaul>
	<UseKernelDriver>false</UseKernelDriver>
	<AllowUnsupportedUpgrades>false</AllowUnsupportedUpgrades>
	<EstimatedMinutes>15</EstimatedMinutes>
	<Git>https://github.com/x2Swiftyouz/Akati-Os</Git>
	<FeaturePages>
		<RadioPage IsRequired="true" DefaultOption="defender-enable" Description="Disabling Defender reduces security, and is an option for advanced users only.">
			<TopLine Text="Some anti-cheat games (Valorant, FACEIT) may not work without Defender."/>
			<Options>
				<RadioOption>
					<Text>Enable Defender (recommended)</Text>
					<Name>defender-enable</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable Defender</Text>
					<Name>defender-disable</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://github.com/x2Swiftyouz/Akati-Os/blob/main/docs/OPTIONS.md#defender"/>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="mitigations-default" Description="Disabling mitigations reduces security, and could harm performance on modern CPUs.">
			<TopLine Text="Disabling could improve performance on older CPUs."/>
			<Options>
				<RadioOption>
					<Text>Default Windows Mitigations (recommended)</Text>
					<Name>mitigations-default</Name>
				</RadioOption>
				<RadioOption>
					<Text>Disable All Mitigations</Text>
					<Name>mitigations-disable</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://github.com/x2Swiftyouz/Akati-Os/blob/main/docs/OPTIONS.md#mitigations"/>
		</RadioPage>
		<RadioPage IsRequired="true" DefaultOption="auto-updates-disable" Description="Updates are important for security, you'll get update notifications regardless.">
			<TopLine Text="This can be changed later in Akati OS Center (Tweaks)."/>
			<Options>
				<RadioOption>
					<Text>Disable Automatic Windows Updates</Text>
					<Name>auto-updates-disable</Name>
				</RadioOption>
				<RadioOption>
					<Text>Enable Automatic Windows Updates</Text>
					<Name>auto-updates-default</Name>
				</RadioOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://github.com/x2Swiftyouz/Akati-Os/blob/main/docs/OPTIONS.md#automatic-updates"/>
		</RadioPage>
		<CheckboxPage IsRequired="true" Description="Select the options you would like to use, they can be changed later in Akati OS Center (Tweaks).">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Disable Hibernation</Text>
					<Name>disable-hibernation</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Maximum Performance (Disable Power Saving)</Text>
					<Name>disable-power-saving</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="false">
					<Text>Disable Core Isolation (may break anti-cheat games)</Text>
					<Name>disable-core-isolation</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://github.com/x2Swiftyouz/Akati-Os/blob/main/docs/OPTIONS.md#general-options"/>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Select the options you would like to use, they can be changed later in Akati OS Center (Tweaks).">
			<Options>
				<CheckboxOption>
					<Text>Remove Snipping Tool App</Text>
					<Name>remove-snipping-tool</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Remove Microsoft Edge</Text>
					<Name>uninstall-edge</Name>
				</CheckboxOption>
				<CheckboxOption>
					<Text>Install a Browser</Text>
					<Name>install-another-browser</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://github.com/x2Swiftyouz/Akati-Os/blob/main/docs/OPTIONS.md#software-options"/>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="The Xbox app and Xbox Game Pass need the Microsoft Store. Unused services: printing, search indexing, SuperFetch, network discovery and MSDTC; more: maps, phone, smart card, payments, wallet, parental controls and others. All can be turned back on later in Akati OS Center.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Remove Microsoft Store</Text>
					<Name>remove-store</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Turn off unused services</Text>
					<Name>disable-unused-services</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Turn off more unused services</Text>
					<Name>disable-extra-services</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://github.com/x2Swiftyouz/Akati-Os/blob/main/docs/OPTIONS.md#microsoft-store-and-unused-services"/>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Notifications pop up during games, and Xbox Game Bar records clips in the background (turn them back on in Windows Settings). The Akati OS icon next to the clock shows CPU and RAM and has your apps and tools.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Turn off notifications</Text>
					<Name>disable-notifications</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Turn off Xbox Game Bar</Text>
					<Name>disable-game-bar</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Show Akati OS next to the clock</Text>
					<Name>tray-icon</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://github.com/x2Swiftyouz/Akati-Os/blob/main/docs/OPTIONS.md#notifications-and-game-bar"/>
		</CheckboxPage>
		<CheckboxPage IsRequired="true" Description="Faster response in games, and quick tools when you right-click the desktop. All can be changed later in Akati OS Center &gt; Tweaks.">
			<Options>
				<CheckboxOption IsChecked="true">
					<Text>Force 0.5 ms timer resolution</Text>
					<Name>enable-timer-resolution</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Turn off Sticky Keys and Filter Keys shortcuts</Text>
					<Name>disable-accessibility-shortcuts</Name>
				</CheckboxOption>
				<CheckboxOption IsChecked="true">
					<Text>Add Akati OS to the desktop right-click menu</Text>
					<Name>desktop-menu</Name>
				</CheckboxOption>
			</Options>
			<BottomLine Text="Learn more" Link="https://github.com/x2Swiftyouz/Akati-Os/blob/main/docs/OPTIONS.md#input-and-latency"/>
		</CheckboxPage>
		<RadioImagePage CheckDefaultBrowser="true" DependsOn="install-another-browser" DefaultOption="browser-brave" Description="Select your preferred browser to install. Browser settings are not modified.">
			<TopLine Text="We do not recommend Chrome for privacy reasons."/>
			<Options>
				<RadioImageOption>
					<Text>Brave</Text>
					<Name>browser-brave</Name>
					<FileName>brave</FileName>
					<GradientTopColor>#131524</GradientTopColor>
					<GradientBottomColor>#3b3e4f</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>LibreWolf</Text>
					<Name>browser-librewolf</Name>
					<FileName>librewolf</FileName>
					<GradientTopColor>#057DB6</GradientTopColor>
					<GradientBottomColor>#86D8FF</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Firefox</Text>
					<Name>browser-firefox</Name>
					<FileName>firefox</FileName>
					<GradientTopColor>#FF3647</GradientTopColor>
					<GradientBottomColor>#FFC742</GradientBottomColor>
				</RadioImageOption>
				<RadioImageOption>
					<Text>Chrome</Text>
					<Name>browser-chrome</Name>
					<FileName>chrome</FileName>
					<GradientTopColor>#7E7E7E</GradientTopColor>
					<GradientBottomColor>#D0D0D0</GradientBottomColor>
				</RadioImageOption>
			</Options>
			<BottomLine Text="Which is best for me?" Link="https://github.com/x2Swiftyouz/Akati-Os/blob/main/docs/OPTIONS.md#web-browsers"/>
		</RadioImagePage>
	</FeaturePages>
</Playbook>
