---
title: Akati OS Extras
description: Microsoft Store removal and unused services selected during setup, the Akati OS Windows Terminal color scheme and Akati OS Center shortcuts (Akati OS)
actions:
  - !writeStatus: {status: 'Applying Akati OS extras'}
    # Remove the Microsoft Store (option, ticked by default). Get it back with Akati OS Center or "wsreset -i"
  - !writeStatus: {status: 'Removing Microsoft Store', option: 'remove-store'}
  - !taskKill: {name: 'WinStore.App', ignoreErrors: true, option: 'remove-store'}
  - !appx: {name: 'Microsoft.WindowsStore*', type: family, option: 'remove-store'}

    # Turn off services most gaming PCs do not use (option, ticked by default): printing, search
    # indexing, SuperFetch and network discovery. These are the unchanged AtlasOS scripts, the same as
    # the buttons in Akati OS Center > System settings, where they can be turned on again. Some of them
    # end with "pause" even when silent, so their input comes from nul; setSvc.cmd is found through PATH.
  - !writeStatus: {status: 'Turning off unused services', option: 'disable-unused-services'}
  - !cmd:
    command: 'set "PATH=%windir%\AtlasModules\Scripts;%PATH%" && "AtlasDesktop\6. Advanced Configuration\Services\Printing\Disable Printing.cmd" /silent < nul'
    exeDir: true
    wait: true
    runas: currentUserElevated
    option: 'disable-unused-services'
  - !cmd:
    command: 'set "PATH=%windir%\AtlasModules\Scripts;%PATH%" && "AtlasDesktop\6. Advanced Configuration\Services\Superfetch\Disable SuperFetch.cmd" /silent < nul'
    exeDir: true
    wait: true
    runas: currentUserElevated
    option: 'disable-unused-services'
  - !cmd:
    command: 'set "PATH=%windir%\AtlasModules\Scripts;%PATH%" && "AtlasDesktop\6. Advanced Configuration\Services\Network Discovery\Disable Network Discovery Services.cmd" /silent < nul'
    exeDir: true
    wait: true
    runas: currentUserElevated
    option: 'disable-unused-services'
    # Search indexing needs TrustedInstaller (the script restarts itself through RunAsTI otherwise)
  - !cmd:
    command: 'set "PATH=%windir%\AtlasModules\Scripts;%PATH%" && "AtlasDesktop\3. General Configuration\Search Indexing\Disable Search Indexing.cmd" /silent < nul'
    exeDir: true
    wait: true
    runas: trustedInstaller
    option: 'disable-unused-services'

    # Windows Terminal color scheme and profile for all users (a Terminal "fragment")
  - !powerShell:
    command: |
      $dir = Join-Path $env:ProgramData 'Microsoft\Windows Terminal\Fragments\AkatiOS'
      New-Item -ItemType Directory -Path $dir -Force | Out-Null
      Copy-Item -Path '.\AtlasModules\Other\AkatiOS\terminal-fragment.json' -Destination (Join-Path $dir 'akatios.json') -Force
    exeDir: true
    wait: true

    # Akati OS Center shortcuts on the desktop and in the Start menu (all users)
  - !powerShell:
    command: |
      $windir = [Environment]::GetFolderPath('Windows')
      $shell = New-Object -ComObject WScript.Shell
      foreach ($folder in @([Environment]::GetFolderPath('CommonDesktopDirectory'), (Join-Path ([Environment]::GetFolderPath('CommonStartMenu')) 'Programs'))) {
          $lnk = $shell.CreateShortcut((Join-Path $folder 'Akati OS Center.lnk'))
          $lnk.TargetPath = Join-Path $windir 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $lnk.Arguments = '-NoProfile -ExecutionPolicy Bypass -WindowStyle Hidden -File "' + (Join-Path $windir 'AtlasModules\AkatiCenter\AkatiCenter.ps1') + '"'
          $lnk.IconLocation = (Join-Path $windir 'AtlasModules\Other\akatios-folder.ico') + ',0'
          $lnk.Description = 'Akati OS Center'
          $lnk.WindowStyle = 7
          $lnk.Save()
      }
    wait: true
