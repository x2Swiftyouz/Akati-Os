---
title: Akati OS Unused Services
description: Turns off printing, search indexing, SuperFetch, network discovery and MSDTC, and sets the timer resolution, when selected during setup (Akati OS)
actions:
    # Turn off services most gaming PCs do not use (option, ticked by default): printing, search
    # indexing, SuperFetch and network discovery. These are the unchanged AtlasOS scripts, the same as
    # the buttons in Akati OS Center > System settings, where they can be turned on again. Some of them
    # end with "pause" even when silent, so their input comes from nul; setSvc.cmd is found through PATH.
    # This task runs last: atlas\services.yml sets up minimal search indexing and would turn it back on.
  - !writeStatus: {status: 'Turning off unused services', option: 'disable-unused-services'}
  - !cmd:
    command: 'set "PATH=%windir%\AtlasModules\Scripts;%PATH%" && "AtlasDesktop\6. Advanced Configuration\Services\Printing\Disable Printing.cmd" /silent < nul'
    exeDir: true
    wait: true
    runas: currentUserElevated
    option: 'disable-unused-services'
  - !cmd:
    command: 'set "PATH=%windir%\AtlasModules\Scripts;%PATH%" && "AtlasDesktop\6. Advanced Configuration\Services\Superfetch\Disable SuperFetch.cmd" /silent < nul'
    exeDir: true
    wait: true
    runas: currentUserElevated
    option: 'disable-unused-services'
  - !cmd:
    command: 'set "PATH=%windir%\AtlasModules\Scripts;%PATH%" && "AtlasDesktop\6. Advanced Configuration\Services\Network Discovery\Disable Network Discovery Services.cmd" /silent < nul'
    exeDir: true
    wait: true
    runas: currentUserElevated
    option: 'disable-unused-services'
    # Search indexing needs TrustedInstaller (the script restarts itself through RunAsTI otherwise)
  - !cmd:
    command: 'set "PATH=%windir%\AtlasModules\Scripts;%PATH%" && "AtlasDesktop\3. General Configuration\Search Indexing\Disable Search Indexing.cmd" /silent < nul'
    exeDir: true
    wait: true
    runas: trustedInstaller
    option: 'disable-unused-services'
    # Distributed Transaction Coordinator (MSDTC): only database and server software uses it, but it is
    # started at times and stays in the background. Disabled from the next start (default: Manual, 3)
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Services\MSDTC', value: 'Start', data: '4', type: REG_DWORD, option: 'disable-unused-services'}
    # More services gaming PCs rarely use (option, ticked by default): AllJoyn Router, Fax, Downloaded Maps
    # Manager, Phone Service, Retail Demo, Windows Insider, Smart Card (3 services), Parental Controls, Payments
    # and NFC, Wallet, Windows Media Player network sharing and Recommended Troubleshooting. Disabled from the
    # next start; services this Windows does not have are skipped (no empty service keys are made). Back to the
    # Windows defaults with the "Turn off more unused services" switch in Akati OS Center > Tweaks.
  - !writeStatus: {status: 'Turning off more unused services', option: 'disable-extra-services'}
  - !powerShell:
    command: |
      foreach ($name in 'AJRouter', 'Fax', 'MapsBroker', 'PhoneSvc', 'RetailDemo', 'wisvc', 'SCardSvr', 'ScDeviceEnum', 'SCPolicySvc',
          'WpcMonSvc', 'SEMgrSvc', 'WalletService', 'WMPNetworkSvc', 'TroubleshootingSvc') {
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Services\' + $name
          if (Test-Path $key) { Set-ItemProperty -Path $key -Name Start -Value 4 -Type DWord }
      }
    wait: true
    option: 'disable-extra-services'
    # Timer resolution 0.5 ms (option, ticked by default): the unchanged AtlasOS script, which sets
    # GlobalTimerResolutionRequests and adds the "Force Timer Resolution" task. Off again in Akati OS Center > Tweaks.
  - !writeStatus: {status: 'Setting timer resolution', option: 'enable-timer-resolution'}
  - !cmd:
    command: '"AtlasDesktop\3. General Configuration\Timer Resolution\Enable timer resolution.cmd" /silent < nul'
    exeDir: true
    wait: true
    runas: currentUserElevated
    option: 'enable-timer-resolution'
